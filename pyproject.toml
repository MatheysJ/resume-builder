[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
dynamic = ["version"]
description = "Gera currículos em PDF a partir de YAML, com temas em CSS (WeasyPrint)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "weasyprint>=62",
  "jinja2>=3.1",
  "pyyaml>=6",
  "pypdf>=4",
  "pypdfium2>=4",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
resume-builder = "resume_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "resume_builder.__version__" }

[tool.setuptools.package-data]
resume_builder = ["templates/*.j2", "themes/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
