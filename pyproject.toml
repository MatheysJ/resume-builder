[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
dynamic = ["version"]
description = "Gera currículos em PDF a partir de YAML (WeasyPrint) e prepara candidaturas a vagas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "weasyprint>=62",
  "jinja2>=3.1",
  "pyyaml>=6",
  "pypdf>=4",
  "pypdfium2>=4",
  "pillow>=10",
]

[project.optional-dependencies]
jobhunt = ["pydantic>=2.7"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
resume-builder = "resume_builder.cli:main"
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "resume_builder.__version__" }

[tool.setuptools.package-data]
resume_builder = ["templates/*.j2", "themes/*.css"]
jobhunt = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
