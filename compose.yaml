x-common: &common
  build: .
  image: resume-builder
  working_dir: /work
  volumes:
    - .:/work
  environment:
    # Mounted src/ shadows the installed package, so edits need no rebuild.
    PYTHONPATH: /work/src

services:
  resume:
    <<: *common

  jobhunt:
    <<: *common
    entrypoint: ["jobhunt"]
    command: ["--help"]

  test:
    <<: *common
    entrypoint: ["pytest", "-q", "-p", "no:cacheprovider"]
    command: []
