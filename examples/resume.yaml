summary: >
  Engenheira de software com 6 anos em sistemas de pagamento. Back-end em
  **Java e Spring Boot**, microsserviços na AWS e mensageria orientada a
  eventos. Referência técnica do time em integrações e observabilidade.

sections:
  - title: Experiência
    kind: entries
    items:
      - title: Engenheira de Software Sênior
        org: Pagamentos Exemplo S.A.
        period: jan 2023 – atual
        location: Remoto
        bullets:
          - Desenhei a migração da liquidação diária de um monólito para três microsserviços em EKS, sem janela de indisponibilidade.
          - Reduzi o tempo de conciliação de **4 h para 35 min** com processamento em lotes paralelos e filas SQS.
          - Defini o padrão de logs estruturados e rastreamento distribuído adotado por cinco squads.
          - Conduzo revisões de código e mentoria de duas pessoas desenvolvedoras júnior.
      - title: Engenheira de Software
        org: Varejo Digital Ltda.
        period: mar 2020 – dez 2022
        location: São Paulo, SP
        bullets:
          - Back-end do checkout em Spring Boot, com antifraude síncrono e estorno assíncrono via RabbitMQ.
          - Testes de contrato entre serviços, que derrubaram em 60% os incidentes de integração.
      - title: Desenvolvedora (estágio)
        org: Software House Exemplo
        period: fev 2019 – fev 2020
        bullets:
          - APIs REST em Java para aplicativos internos e automação de testes com JUnit.

